<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrailFrame — Registrácia</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#F5F0E8;--bg2:#E8E0D0;--sage:#7A9E7E;--teal:#4AADA0;
    --terracotta:#D4845A;--forest:#4A5C4A;--muted:#8A9A8A;--border:#E8E0D0;
  }
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--forest);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:44px;width:100%;max-width:420px;box-shadow:0 4px 24px rgba(74,92,74,0.08)}
  .logo{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;color:var(--sage);text-align:center}
  .logo span{color:var(--forest)}
  .card-title{font-family:'Syne',sans-serif;font-size:24px;font-weight:700;text-align:center;color:var(--forest);margin-top:20px;margin-bottom:6px}
  .card-sub{font-size:14px;color:var(--muted);text-align:center;margin-bottom:30px}
  .form-group{margin-bottom:18px}
  label{display:block;font-size:13px;font-weight:500;color:var(--forest);margin-bottom:6px}
  input{width:100%;padding:11px 14px;background:var(--bg);border:1.5px solid var(--border);border-radius:9px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--forest);outline:none;transition:border-color .18s}
  input:focus{border-color:var(--teal);background:#fff}
  input::placeholder{color:var(--muted)}
  .hint{font-size:11px;color:var(--muted);margin-top:5px}
  .btn{width:100%;padding:13px;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:all .18s;margin-top:6px}
  .btn-teal{background:var(--teal);color:#fff}
  .btn-teal:hover{background:#3a9d90}
  .btn-teal:disabled{opacity:.5;cursor:not-allowed}
  .error{background:rgba(212,132,90,0.1);border:1px solid rgba(212,132,90,0.35);border-radius:9px;padding:10px 14px;font-size:13px;color:var(--terracotta);margin-bottom:16px;display:none}
  .success{background:rgba(74,173,160,0.1);border:1px solid rgba(74,173,160,0.3);border-radius:9px;padding:10px 14px;font-size:13px;color:var(--teal);margin-bottom:16px;display:none}
  .divider{text-align:center;font-size:13px;color:var(--muted);margin:22px 0 4px}
  .link{color:var(--teal);text-decoration:none;font-weight:500}
  .link:hover{text-decoration:underline}
  .spinner{display:none;width:18px;height:18px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;margin:0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .back{display:block;text-align:center;margin-top:16px;font-size:13px;color:var(--muted);text-decoration:none}
  .back:hover{color:var(--forest)}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Trail<span>Frame</span></div>
  <div class="card-title">Vytvor si účet</div>
  <div class="card-sub">Zaregistruj sa a začni sledovať svoje dobrodružstvá</div>

  <div class="error" id="errorMsg"></div>
  <div class="success" id="successMsg"></div>

  <div class="form-group">
    <label>Používateľské meno</label>
    <input type="text" id="username" placeholder="napr. janko_hiker" autocomplete="username">
  </div>
  <div class="form-group">
    <label>Email</label>
    <input type="email" id="email" placeholder="tvoj@email.sk" autocomplete="email">
  </div>
  <div class="form-group">
    <label>Heslo</label>
    <input type="password" id="password" placeholder="Minimálne 6 znakov" autocomplete="new-password">
    <div class="hint">Aspoň 6 znakov</div>
  </div>
  <div class="form-group">
    <label>Potvrď heslo</label>
    <input type="password" id="password2" placeholder="Zopakuj heslo" autocomplete="new-password">
  </div>

  <button class="btn btn-teal" id="registerBtn" onclick="register()">
    <span id="btnText">Zaregistrovať sa</span>
    <div class="spinner" id="spinner"></div>
  </button>

  <div class="divider">Už máš účet? <a class="link" href="login.html">Prihlásiť sa</a></div>
  <a class="back" href="index.html">← Späť na úvod</a>
</div>

<script>
const API = 'http://localhost:5000/api';

async function register() {
  const username = document.getElementById('username').value.trim();
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const password2= document.getElementById('password2').value;
  hideMessages();

  if (!username || !email || !password) return showError('Vyplň všetky polia.');
  if (password !== password2) return showError('Heslá sa nezhodujú.');
  if (password.length < 6) return showError('Heslo musí mať aspoň 6 znakov.');

  setLoading(true);
  try {
    const res = await fetch(`${API}/auth/register`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username, email, password})
    });
    const data = await res.json();
    if (!res.ok) return showError(data.message || 'Registrácia zlyhala.');
    localStorage.setItem('token', data.token);
    localStorage.setItem('username', data.username);
    localStorage.setItem('userId', data.userId);
    showSuccess('Registrácia úspešná! Presmerovávame...');
    setTimeout(() => window.location.href = 'app.html', 1200);
  } catch (e) {
    showError('Nepodarilo sa pripojiť k serveru. Beží API na localhost:5000?');
  } finally { setLoading(false); }
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') register(); });
function showError(msg){ const el=document.getElementById('errorMsg'); el.textContent=msg; el.style.display='block'; }
function showSuccess(msg){ const el=document.getElementById('successMsg'); el.textContent=msg; el.style.display='block'; }
function hideMessages(){ document.getElementById('errorMsg').style.display='none'; document.getElementById('successMsg').style.display='none'; }
function setLoading(on){ document.getElementById('registerBtn').disabled=on; document.getElementById('btnText').style.display=on?'none':'inline'; document.getElementById('spinner').style.display=on?'block':'none'; }
</script>
</body>
</html>
